[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-watchdog"
version = "0.1.0"
description = "稼働見守り台帳: 定例 cron の最終成功・期限超過を見守る"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
